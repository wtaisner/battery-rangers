# REINVENT4 TOML input example for transfer learning
#
# Focus a given model towards a set of input SMILES.  This can also be used to
# start from scratch from and an untrained prior.


run_type = "transfer_learning"
device = "cuda:0"  # set torch device e.g. "cpu"
tb_logdir = "tb_TL"  # name of the TensorBoard logging directory
seed =  23
# number_of_cpus = 16 # optional parameter to control number of cpus for pair generation. If not provided, only one CPU will be used.
[parameters]
num_epochs = 500  # number of steps to run
save_every_n_epochs = 50  # save checkpoint model file very N steps
batch_size = 4096
num_refs = 0  # number of reference molecules randomly chosen for similarity
                # set this to zero for large datasets (>200 molecules)!
sample_batch_size = 100  # number of sampled molecules to compute sample loss

randomize_smiles = false
standardize_smiles = false

## Reinvent
#input_model_file = "modules/REINVENT4/priors/reinvent.prior"
input_model_file = "outputs/reinvent_empty_model_chembl_35.model"
output_model_file = "outputs/transfer_learning/200_epochs/pretrained_chembl_35.model"

smiles_file = "data/chembl_35_sqlite/chembl_35_train.smi"
validation_smiles_file = "data/chembl_35_sqlite/chembl_35_val.smi"
