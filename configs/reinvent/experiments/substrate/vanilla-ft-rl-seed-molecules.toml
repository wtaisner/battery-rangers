name = "substrate_vanilla_ft_rl_seed_molecules"
molecule_type = "substrate"
prior_type = "vanilla"
recipe = "ft_rl_inception"

[tl]
smiles_file = "data/raw/substrate/ctf_train.smi"
validation_smiles_file = "data/raw/substrate/ctf_test.smi"
# USE FOR CHEMBL35 pre-trained dataset with false, true for vanilla prior
randomize_smiles = true
standardize_smiles = true

[rl]
known_smiles_path = "data/raw/substrate/ctf_train.smi"

[rl.inception]
smiles_file = "data/raw/substrate/ctf_train.smi"
memory_size = 100
sample_size = 10

