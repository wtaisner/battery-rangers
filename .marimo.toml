[runtime]
watcher_on_save = "lazy"
output_max_bytes = 8000000
reactive_tests = true
on_cell_change = "autorun"
auto_reload = "autorun"
std_stream_max_bytes = 1000000
auto_instantiate = false
default_sql_output = "auto"

[completion]
activate_on_typing = true
copilot = "github"

[save]
autosave_delay = 1000
format_on_save = true
autosave = "after_delay"

[experimental]
lsp = true

[package_management]
manager = "uv"

[diagnostics]
enabled = true

[display]
cell_output = "below"
code_editor_font_size = 14
default_table_page_size = 10
dataframes = "rich"
theme = "light"
default_width = "full"

[ai]
rules = ""

[ai.google]

[ai.open_ai]

[ai.anthropic]

[ai.bedrock]

[server]
follow_symlink = false
browser = "default"

[snippets]
custom_paths = []
include_default_snippets = true

[keymap]
preset = "default"

[keymap.overrides]

[language_servers.pylsp]
enable_pydocstyle = true
enable_pylint = false
enable_pyflakes = false
enable_mypy = true
enable_ruff = true
enabled = true
enable_flake8 = false

[formatting]
line_length = 160
