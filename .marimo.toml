[experimental]
lsp = true

[completion]
copilot = "github"
activate_on_typing = true

[formatting]
line_length = 160

[runtime]
auto_reload = "autorun"
default_auto_download = []
output_max_bytes = 8000000
default_sql_output = "auto"
reactive_tests = true
auto_instantiate = false
on_cell_change = "autorun"
watcher_on_save = "lazy"
std_stream_max_bytes = 1000000

[display]
code_editor_font_size = 14
theme = "light"
default_width = "full"
default_table_max_columns = 50
default_table_page_size = 10
cell_output = "below"
dataframes = "rich"
reference_highlighting = true

[keymap]
preset = "default"
destructive_delete = true

[keymap.overrides]

[package_management]
manager = "uv"

[save]
autosave_delay = 1000
format_on_save = true
autosave = "after_delay"

[server]
browser = "default"
follow_symlink = false

[diagnostics]
enabled = true
sql_linter = true

[language_servers.pylsp]
enable_ruff = true
enable_pylint = false
enable_flake8 = false
enable_pyflakes = false
enable_pydocstyle = true
enabled = true
enable_mypy = true

[snippets]
custom_paths = []
include_default_snippets = true

[ai]
inline_tooltip = true
mode = "manual"
rules = "Always use type hinds, add documentation."

[ai.anthropic]

[ai.google]

[ai.models]
chat_model = "github/gpt-4o-mini"
displayed_models = []
custom_models = []
edit_model = "github/gpt-4o-mini"

[ai.open_ai]

[ai.bedrock]

[mcp]
presets = []

[mcp.mcpServers]
