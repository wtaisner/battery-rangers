[keymap]
destructive_delete = true
preset = "default"

[keymap.overrides]

[completion]
activate_on_typing = true
copilot = "github"

[save]
autosave = "after_delay"
autosave_delay = 1000
format_on_save = true

[diagnostics]
enabled = true

[display]
code_editor_font_size = 14
theme = "light"
default_table_max_columns = 50
cell_output = "below"
default_table_page_size = 10
default_width = "full"
dataframes = "rich"
reference_highlighting = true

[ai]
mode = "manual"
rules = ""

[ai.anthropic]

[ai.bedrock]

[ai.open_ai]

[ai.google]

[formatting]
line_length = 160

[experimental]
lsp = true

[package_management]
manager = "uv"

[snippets]
custom_paths = []
include_default_snippets = true

[runtime]
output_max_bytes = 8000000
auto_reload = "autorun"
default_auto_download = []
std_stream_max_bytes = 1000000
reactive_tests = true
on_cell_change = "autorun"
auto_instantiate = false
watcher_on_save = "lazy"
default_sql_output = "auto"

[server]
follow_symlink = false
browser = "default"

[language_servers.pylsp]
enabled = true
enable_flake8 = false
enable_mypy = true
enable_ruff = true
enable_pylint = false
enable_pydocstyle = true
enable_pyflakes = false
