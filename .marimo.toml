[server]
follow_symlink = false
browser = "default"

[ai]
rules = ""

[ai.anthropic]

[ai.google]

[ai.open_ai]

[completion]
activate_on_typing = true
copilot = "github"

[display]
default_width = "full"
cell_output = "below"
default_table_page_size = 10
dataframes = "rich"
code_editor_font_size = 14
theme = "light"

[keymap]
preset = "default"

[keymap.overrides]

[runtime]
auto_reload = "autorun"
watcher_on_save = "lazy"
std_stream_max_bytes = 1000000
on_cell_change = "autorun"
output_max_bytes = 8000000
reactive_tests = true
auto_instantiate = false
#pythonpath = []
#dotenv = []

[snippets]
custom_paths = []
include_default_snippets = true

[formatting]
line_length = 160

[save]
format_on_save = true
autosave = "after_delay"
autosave_delay = 1000

[package_management]
manager = "uv"

[diagnostics]
enabled = true               # Show diagnostics in the editor

[language_servers.pylsp]
enable_pyflakes = false
enable_ruff = true
enabled = true
enable_flake8 = false
enable_mypy = true
enable_pydocstyle = true
enable_pylint = false

[experimental]
lsp = true
