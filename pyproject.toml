[project]
name = "battery-rangers"
version = "0.1.0"
description = "A repository for molecule machine learning for batteries."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "deepchem>=2.8.0",
    "diffusers>=0.32.2",
    "jupyter>=1.1.1",
    "mlxtend>=0.23.4",
    "networkx>=3.4.2",
    "numpy>=2.2.2",
    "openpyxl>=3.1.5",
    "pre-commit>=4.1.0",
    "pylint>=3.3.3",
    "pymatgen>=2025.1.23",
    "pyscf>=2.8.0",
    "pytest>=8.3.4",
    "pytorch-lightning>=2.5.0.post0",
    "scikit-learn>=1.6.1",
    "scikit-optimize>=0.10.2",
    "seaborn>=0.13.2",
    "tomlkit>=0.13.2",
    "torch>=2.5.1",
    "torchvision>=0.20.1",
    "vtk>=9.4.1",
    "xgboost>=2.1.3",
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
