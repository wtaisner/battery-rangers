[project]
name = "battery-rangers"
version = "0.1.0"
description = "A repository for molecule machine learning for batteries."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.5.1",
    "cairosvg>=2.7.1",
    "docker>=7.1.0",
    "fastparquet>=2024.11.0",
    "fcd-torch>=1.0.7",
    "jupyter>=1.1.1",
    "lets-plot>=4.6.2",
    "mlxtend>=0.23.4",
    "molscore>=1.9.3",
    "networkx>=3.4.2",
    "numpy>=2.2.2",
    "openpyxl>=3.1.5",
    "pre-commit>=4.1.0",
    "pylint>=3.3.3",
    "pymatgen>=2025.1.23",
    "pyscf>=2.8.0",
    "pytest>=8.3.4",
    "python-lsp-server>=1.12.2",
    "pytorch-lightning>=2.5.0.post0",
    "rdkit>=2025.3.5",
    "scikit-learn>=1.6.1",
    "scikit-optimize>=0.10.2",
    "seaborn>=0.13.2",
    "selfies>=2.2.0",
    "tbparse>=0.0.9",
    "tensorboard>=2.19.0",
    "toml>=0.10.2",
    "torch>=2.8.0",
    "torchvision>=0.23.0",
    "vtk>=9.4.1",
    "xgboost>=2.1.3",
    "reinvent",
    "anndata>=0.12.3",
    "more-itertools>=10.8.0",
    "wandb>=0.23.0",
    "upsetplot>=0.9.0",
    "polars>=1.36.1",
    "marimo>=0.19.2",
    "gymnasium>=1.2.3",
    "tyro>=1.0.8",
    "ty>=0.0.34",
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
reinvent = { path = "modules/REINVENT4", editable = true }

[tool.ruff]
# Increased to accomodate intentionally long SMILES / example strings used in tests/examples.
line-length = 300
target-version = "py311"

exclude = [
    "apps/simpleDAS",
    "*.ipynb",
    "notebooks/",
    "tests/"
]

[tool.ruff.lint]
select = ["E", "F", "I", "PL", "N", "D"]
ignore = [
    "D100", "D104", # Missing docstrings in modules/packages
    "D105", # Missing docstring in magic method
    "D401", # First line should be in imperative mood
    "D400", # First line should end with a period
    "D415", # First line should end with a period, question mark, or exclamation point
    "D205", # 1 blank line required between summary line and description
    "D404", # First word of the docstring should not be "This"
    "D107", # Missing docstring in `__init__`
    # General docstring and return/arg formatting rules - noisy for large codebase with many example literals
    "D101", "D102", "D103", "D105", "D201", "D203", "D301", "D417",
    "PLR0912", # too-many-branches
    "PLR0913", # too-many-arguments
    "PLR0914", # too-many-locals
    "PLR0915", # too-many-statements
    "PLR2004", # Magic value used in comparison, consider replacing `2` with a constant variable
    "PLW0603", # Using the global statement to update `mean_fft_array_shared` is discouraged
    "PLW2901", # `for` loop variable <> overwritten by assignment target
    "N812", # Lowercase `functional` imported as non-lowercase `F`
    "N805", # First argument of a method should be named `self`
    "N815", # Variable `rangeType` in class scope should not be mixedCase
]

[tool.ruff.lint.pylint]
max-args = 5
max-bool-expr = 5
max-branches = 12
max-returns = 6
max-statements = 50

# Per-file ignores
[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"] # imported but unused

# Very long example data / constant literals and docstring noise: avoid line-length / docstring formatting failures.
"modules/core/filters/symmetry_filter.py" = ["E501", "D205", "D400", "D401", "D404", "D415", "PLR0911"]
"modules/core/filters/point_group_symmetry_filter.py" = ["E501", "D205"]
"scripts/reinvent_run_experiments.py" = ["E501", "D205"]

[tool.pydoclint]
style = 'google'
# Increase to match ruff's new allowance (examples and long literal strings)
max-line-length = 300
check-type-hint = true
check-arg-order = true
# Extended exclude: skip notebooks, tests, and the large filter modules and scripts that contain
# intentionally long sample data and examples that would otherwise trigger many docstring warnings.
exclude = '^(apps/simpleDAS/|notebooks/|tests/|modules/core/|modules/predictor/|modules/generation/|scripts/|apps/processing_pipeline/src/modules/detect_anomaly\.py|apps/processing_pipeline/mp_processing_test\.py|.*\.ipynb$)'
check-class-attributes = false
check-return-types = true

[tool.ty.src]
# Define which directories are part of your source code
include = [
    "modules/core",
    "modules/generation",
    "modules/predictor",
    "modules/reinforcement_learning"
]

# Define what to skip (Ty finally supports this inside the src table)
exclude = [
    "modules/bionemo",
    "modules/REINVENT4",
    "modules/mol_air",
    "notebooks",
    "tests",
    "**/*.ipynb"
]

[tool.ty.analysis]
respect-type-ignore-comments = true

[tool.ty.rules]
possibly-missing-attribute = "ignore"
invalid-type-form = "ignore"
unresolved-import = "ignore"
invalid-argument-type = "ignore"
not-iterable = "ignore"
unresolved-attribute = "ignore"
no-matching-overload = "ignore"
